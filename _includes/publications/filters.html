<div class="publication-toolbar">

    <div class="publication-search">

        <label for="publication-search">Search publications</label>

        <div class="publication-search-field">

            <i class="fas fa-search" aria-hidden="true"></i>

            <input
                id="publication-search"
                type="text"
                placeholder="Search publications..."
                aria-controls="publication-list">

        </div>

    </div>

    <div class="publication-type-filter">

        <label for="publication-type">Publication type</label>

        <select id="publication-type" aria-controls="publication-list">

        <option value="all">All publications</option>
        <option value="article">Journal articles</option>
        <option value="inproceedings">Conference papers</option>
        <option value="book">Books</option>
        <option value="phdthesis">Theses</option>

        </select>

    </div>

</div>

<div id="publication-tags" role="group" aria-label="Filter publications by subject"></div>
