<section>

<h2>Tutorials, Workshops &amp; Demos</h2>

<div class="community-grid">

{% for item in site.data.community.tutorials %}
<article class="community-card">

<h3>{{ item.title | escape }}</h3>

<div class="community-tags">
    <span>{{ item.type | escape }}</span>
</div>

<p>
    {{ item.conference | escape }} · {{ item.year }} · {{ item.location | escape }}
</p>

{% if item.description %}
<p class="community-event-description">{{ item.description | escape }}</p>
{% endif %}

</article>
{% endfor %}

</div>

</section>
