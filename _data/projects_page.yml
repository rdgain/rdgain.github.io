    links:
      - label: View case study
        url: /projects/pommerman/
        type: case_study
      - label: Research
        url: /research/
        type: publication
      - label: Source code
        url: https://github.com/rdgain/java-pommerman
        type: repository
    case_study:
      summary: >
        A Java implementation of Pommerman for research with statistical
        forward-planning agents, developed in collaboration with DSTL.
      why_it_matters: >
        Pommerman provides a competitive, partially observable multi-agent
        environment for evaluating planning methods. The research needed a
        Java environment compatible with its agent implementations and
        configurable scenarios.
      problem: >
        The available Pommerman framework was written in Python, while the
        statistical forward-planning research stack used Java. The project
        required a compatible implementation and scenario modifications for
        controlled experiments.
      approach: >
        Developed a Java version of the Python Pommerman framework and modified
        scenarios to support integration with statistical forward-planning
        agents. The project followed an earlier OpDST collaboration.
      role: >
        For Pommerman, I worked on the Java framework and scenario
        modifications. In the earlier OpDST collaboration with Queen Mary, the
        Alan Turing Institute and DSTL, my contribution covered framework
        engineering, experimental design, and results analysis and reporting.
      outcomes:
        - A Java Pommerman environment enabled integration with statistical forward-planning agents.
        - The associated study compared MCTS and RHEA in multiple Pommerman settings.

