featured:
  - id: llm-program-search
    title: LLM Program Search for Games
    category: Research highlight
    image: /assets/images/projects/LLM-thumb.png
    image_alt: Illustration of an LLM guiding code toward several different game environments
    summary: >
      Benchmarked LLM-guided program search across 29 game-related tasks in
      Python and Java, evaluating 11 language models and multiple search runs.
    technologies:
      - Large language models
      - Program search
      - Hill climbing
      - Python
      - Java
      - Benchmarking
    links:
      - label: View case study
        url: /projects/llm-program-search/
        type: case_study
      - label: Read the paper
        url: https://arxiv.org/abs/2412.04057
        type: publication
    case_study:
      summary: >
        A benchmark study of using large language models to guide iterative
        program search across game-related tasks in Python and Java.
      why_it_matters: >
        Game-playing programs are difficult to write and tune across varied game
        rules. This project tests whether language models can help search for
        usable programs, and how task type and search strategy affect the result.
      problem: >
        A single successful code-generation example does not show whether
        language models can reliably produce useful programs across different
        games and programming tasks. The work needed a broad, repeatable
        evaluation rather than a demonstration on one task.
      approach: >
        The study used hill-climbing program search, with language models
        controlling initial programs and mutations. The benchmark covered 29
        tasks and 11 models across Python and Java. Python tasks included
        miniature Atari games, Baba Is You levels, an Asteroids-inspired
        environment and maze generation; Java tasks used 12 games implemented
        in TAG.
      role: >
        Raluca D. Gaina is listed as a co-author. Confirm her specific
        contribution to benchmark design, implementation, experiments and
        writing before making a more detailed personal-contribution claim.
      outcomes:
        - The paper reports that task choice affected performance more than model size in the evaluated benchmark.
        - Multiple search runs with fewer iterations performed better than one run with more iterations in the reported experiments.
        - The benchmark connects LLM-guided program search with both video-game tasks and tabletop games implemented in TAG.

