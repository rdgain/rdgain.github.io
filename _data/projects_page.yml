    image: /assets/images/projects/TRD-thumb.png
    image_alt: Tabletop board with simulated player moves and AI analytics
    summary: >
      Co-founded a company developing AI-assisted playtesting tools, translating
      tabletop designers' needs into digital twins, large-scale simulations and
      a SaaS product roadmap.
    technologies:
      - Java
      - Object-oriented design patterns
      - R
      - AI playtesting
      - Simulation
      - Game AI
      - Product development
      - Entrepreneurship
      - Scalable architecture
      - Translation of ambiguous designer problems into technical solutions
      - Communication of technical solutions to non-technical stakeholders
    links:
      - label: View case study
        url: /projects/tabletop-rnd/
        type: case_study
      - label: Company website
        url: https://www.tabletoprnd.com
        type: website
      - label: Related tabletop-game research
        url: /research/?project=tabletop-rnd
        type: publication
    case_study:
      summary: >
        A company applying simulation and AI to help tabletop designers explore
        gameplay and evaluate game balance.
      why_it_matters: >
        Physical playtests are valuable but can be slow to repeat and difficult to
        scale across many game configurations. Simulation can help designers
        investigate more in depth how rules and balance choices affect play,
        alongside subjective human feedback.
      problem: >
        Designers need practical ways to test complex tabletop systems and compare
        gameplay outcomes.
      approach: >
        The project combines digital representations of tabletop games, simulation
        and AI agents to run and analyse gameplay. We created digital twins of
        physical games and ran thousands of simulations to analyse gameplay,
        explore game balance and inform design decisions. More details and example
        projects are available on the company website and in related publications.
      role: >
        As co-founder and director, I worked with tabletop designers and clients
        to translate design needs into technical solutions. I focused on business
        development, product design and research coordination. I defined product
        direction, the technical roadmap, scalable architecture and AI integration
        strategy, and led the transition toward a SaaS product with user-facing
        tools. I also implemented tools to make development of new games and AI
        agents faster and more consistent, coordinated technical developments in
        the UK Creative Catalyst programme, and represented the company at trade
        shows and conferences including UK Games Expo and Spiel Essen.
      outcomes:
        - Co-founded and directed Tabletop R&D.
        - The current product direction is focused on AI-assisted tabletop playtesting and balance analysis.
        - Over £120k raised for R&D through Innovate UK and Queen Mary Innovation.
        - Clients include Bright Eye Games, AP Board Games and Underdog Games.

