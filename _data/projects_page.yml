    summary: >
      Developed a Java version of Pommerman for statistical forward-planning
      agents and scenario modifications with Queen Mary and DSTL. This work
      builds on an earlier OpDST collaboration with Queen Mary, the Alan Turing
      Institute and DSTL, where I contributed framework engineering,
      experimental design, and results analysis and reporting.
    technologies:
      - Java
      - Python
      - Planning and search
