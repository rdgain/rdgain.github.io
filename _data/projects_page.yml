    image: /assets/images/projects/TAG-thumb.png
    image_alt: Tabletop game board connected to code, AI agents and game analytics
    summary: >
      Co-led the design and engineering of a reusable Java framework for modern
      tabletop games and AI agents, now spanning over 60 titles and supporting
      shared experiments, simulation and game analytics.
    technologies:
      - Java
      - Object-oriented design patterns
      - Game systems
      - Game AI
      - Simulation
      - Open source
      - Software engineering
      - Large-codebase engineering
      - Scalable architecture
