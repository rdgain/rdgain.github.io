supervision:

  featured: true

  title: Undergraduate & MSc Project Supervision

  years: "2022–2026"

  institution: Queen Mary University of London

  description: >
    Supervised undergraduate and postgraduate dissertations spanning
    Game AI, machine learning, procedural generation, simulation,
    computer vision and software engineering.

  project_count: 25+

  projects:

  - title: Pacifist NetHack Agent
    subtitle: Proximal Reward Shaping with Action Masking
    tags:
      - Reinforcement Learning
      - NetHack
      - Deep RL
    summary: >
      Investigated reward shaping techniques for creating non-violent
      reinforcement learning agents in NetHack.

  - title: AI for Board Game Engagement
    subtitle: Replacing Randomness with AI
    tags:
      - Tabletop Games
      - AI
      - Player Modelling
    summary: >
      Explored whether AI-controlled mechanics can improve player engagement
      compared with traditional random elements.

  - title: Stratego AI in TAG
    subtitle: Partial Information Search
    tags:
      - TAG
      - Tabletop Games
      - Search
    summary: >
      Implemented and evaluated General Game Playing agents for Stratego
      within the TAG Framework.

  - title: Chess Win Prediction
    subtitle: Machine Learning
    tags:
      - Machine Learning
      - Chess
      - Data Analysis
    summary: >
      Developed predictive models estimating game outcomes from board state.

  - title: Macro Actions for Survival Games
    subtitle: Decision Making
    tags:
      - Planning
      - Game AI
    summary: >
      Investigated temporal abstractions for AI agents in open-world survival
      games.

  - title: Gym-MicroRTS Strategy Learning
    subtitle: Reinforcement Learning
    tags:
      - Reinforcement Learning
      - MicroRTS
    summary: >
      Explored reward shaping techniques to influence strategic behaviour.

  - title: RHCA Minimax
    subtitle: Rolling Horizon Coevolution
    tags:
      - Evolutionary Algorithms
      - Search
    summary: >
      Extended Rolling Horizon algorithms to competitive adversarial domains.

  - title: LSTM Text Prediction
    subtitle: Neural Networks
    tags:
      - Deep Learning
      - NLP
    summary: >
      Built an autosuggestion system using recurrent neural networks.

  - title: Highlight Detection in Tabletop Games
    subtitle: Gameplay Analytics
    tags:
      - Computer Vision
      - Tabletop Games
    summary: >
      Detected automatically interesting gameplay moments from game logs.

  - title: Root Decision Making
    subtitle: Asymmetric Games
    tags:
      - Tabletop Games
      - Search
    summary: >
      Studied AI strategies for asymmetric board games.

  - title: Zombie Shooter
    subtitle: Unity Game Development
    tags:
      - Unity
      - Game Development
    summary: >
      Developed an open-world zombie survival game in Unity.

  - title: Texas Hold'em AI
    subtitle: Counterfactual Regret Minimisation
    tags:
      - CFR
      - Poker
      - Game Theory
    summary: >
      Investigated modern poker AI techniques for strategic play.

  - title: ECS Game Engine
    subtitle: C++
    tags:
      - C++
      - Engine Programming
    summary: >
      Designed a complete ECS-based 2D game engine and editor.

  - title: Everdell AI
    subtitle: TAG Framework
    tags:
      - TAG
