llm:
  title: LLM Program Search for Games
  category: Research highlight
  image: /assets/images/projects/LLM-thumb.png
  image_alt: Illustration of an LLM guiding code toward several different game environments
  summary: >
    A benchmark study of using large language models to guide iterative program
    search across game-related tasks in Python and Java.
  why_it_matters: >
    Game-playing programs are difficult to write and tune across varied game
    rules. This project tests whether language models can help search for usable
    programs, and how task type and search strategy affect the result.
  problem: >
    A single successful code-generation example does not show whether language
    models can reliably produce useful programs across different games and
    programming tasks. The work needed a broad, repeatable evaluation rather
    than a demonstration on one task.
  approach: >
    The study used hill-climbing program search, with language models controlling
    initial programs and mutations. The benchmark covered 29 tasks and 11 models
    across Python and Java. The Python tasks included miniature Atari games,
    Baba Is You levels, an Asteroids-inspired environment and maze generation;
    the Java tasks used 12 games implemented in TAG.
  role: >
    My role focused on designing the TAG-based benchmark, implementation of the LLM interaction with
    the existing Java codebase, automatic extraction of the TAG API and prompt engineering.
    I've also built a user interface for running the benchmark, visualising the results, inspecting the generated code
    and iterating on it with further human prompts to influence the LLM search.
  outcomes:
    - The paper reports that task choice affected performance more than model size in the evaluated benchmark.
    - Multiple search runs with fewer iterations performed better than one run with more iterations in the reported experiments.
    - The benchmark connects LLM-guided program search with both video-game tasks and tabletop games implemented in TAG.
  technologies:
    - Large language models (LLMs)
    - Program search
    - Hill climbing
    - Python
    - Java
    - Benchmarking
  publications:
    - label: "From code to play: Benchmarking program search for games using large language models"
      url: https://arxiv.org/abs/2412.04057

tabletop:
  title: Tabletop R&D
  category: AI-assisted game testing
  image: /assets/images/projects/TRD-thumb.png
  image_alt: Tabletop board with simulated player moves and AI analytics
  summary: >
    A company applying simulation and AI to help tabletop designers explore
    gameplay and evaluate game balance.
  why_it_matters: >
    Physical playtests are valuable but can be slow to repeat and difficult to
    scale across many game configurations. Simulation can help designers
    investigate more in depth how rules and balance choices affect play,
    alongside subjective human feedback.
  problem: >
    Designers need practical ways to test complex tabletop systems and compare
    gameplay outcomes. 
  approach: >    
    The project combines digital representations of tabletop games, simulation
    and AI agents to run and analyse gameplay. More details and example
    projects are available on the company website and in related publications.
  role: >
    My role as co-founder and director focused on business development, as well as
    product design and research coordination. I have worked on several specific projects, as well as implementing
    new tools for fast and cohesive imlementations of new games and AI agents. I have coordinated
    technical developments in the UK Creative Catalyst programme and represented the company at many trade shows
    and conferences, including UK Games Expo and Spiel Essen.
  outcomes:
    - Co-founded and directed Tabletop R&D.
    - The current product direction is focused on AI-assisted tabletop playtesting and balance analysis.
    - Over £120k raised in funding for research and development.
    - Clients include Bright Eye Games, AP Board Games and Underdog Games.
  technologies:
    - Java
    - R
    - AI playtesting
    - Simulation
    - Game AI
    - Product development
    - Entrepreneurship
    - Translation of ambiguous designer problems into technical solutions
    - Communication of technical solutions to non-technical stakeholders
  publications:
    - label: Tabletop R&D website
      url: https://www.tabletoprnd.co.uk
    - label: Related tabletop-game research
      url: /publications/

tag:
  title: "TAG: Tabletop Games Framework"
  category: General AI for tabletop games
  image: /assets/images/projects/TAG-thumb.png
  image_alt: Tabletop game board connected to code, AI agents and game analytics
  summary: >
    An open-source Java framework for implementing modern tabletop games,
    connecting them to AI agents and studying their mechanics and gameplay.
  why_it_matters: >
    Modern board, card and dice games combine changing rules, diverse player
    roles, hidden information and many interacting components. TAG provides a
    shared environment for studying these challenges with general AI methods.
  problem: >
    Much game-AI research has focused on classical games, while modern tabletop
    games introduce varied mechanics and information structures. Researchers
    also need consistent game and agent interfaces to compare methods and
    inspect game properties.
  approach: >
    TAG is a Java benchmark with a common API for AI agents, reusable components
    for implementing games, JSON-based game data import and logging for analysis
    of measures such as action space, branching factor and hidden information.
    The 2020 design report describes seven implemented games at that time, but
    the framework now includes over 60 titles.
  role: >
    I am one of the founders and leaders of the TAG project, and I have designed 
    and maintained the core parts of the framework including game structure, API,
    AI agent interaction, game running, user interfaces and metrics recording.
    I have implemented several AI agents (e.g. RHEA) and games (e.g. Terraforming Mars, Pandemic), 
    and I have coordinated, reviewed and revised contributions from other developers and researchers.
    I have led courses and student projects using the TAG framework as a basis for research and development,
    and I have presented the framework at conferences and workshops such as the IEEE Conference on Games.  
  outcomes:
    - A public Java framework and source repository support repeatable AI research in modern tabletop games.
    - The framework paper introduced sample AI players and outlined research directions; it also notes substantial room for improvement.
    - Related studies have used TAG for individual games and AI tasks; add specific examples and verified adoption evidence as appropriate.
  technologies:
    - Java
    - Game systems
    - Game AI
    - Simulation
    - Open source
    - Software design and engineering
    - Large codebase design and maintenance
    - User interface design
    - Game metrics and analysis
  publications:
    - label: "TAG: A Tabletop Games Framework"
      url: /assets/pdf/papers/gaina2020tag.pdf
    - label: TAG design and implementation report
      url: https://arxiv.org/abs/2009.12065
    - label: Source code
      url: https://github.com/GAIGResearch/TabletopGames
    - label: Related publications
      url: /publications/

rhea:
  title: Rolling Horizon Evolutionary Algorithms
  category: Game AI research
  image: /assets/images/projects/RHEA-thumb.png
  image_alt: RHEA infographic focusing on aspects studied (analysis and improvement, optimisation, visualisation and prediction) and applications (such as Pommerman, Tribes, tabletop games, physics simulations and generalisation across games)
  summary: >
    PhD research developing and evaluating Rolling Horizon Evolutionary
    Algorithms (RHEA) for agents that plan in games, including general video-game
    environments.
  why_it_matters: >
    Agents for unfamiliar games cannot depend on a hand-written strategy for
    each title. RHEA offers a way to search action sequences online using a
    forward model and a limited decision-time budget.
  problem: >
    Game-playing agents must choose useful actions with incomplete knowledge of
    future states and often under tight runtime limits. The RHEA research asks
    how evolutionary search, population management, seeding, self-adaptation and
    parameter choices affect performance across different games.
  approach: >
    RHEA evolves candidate sequences of future actions, evaluates them through
    game simulation and executes the first action of the selected sequence
    before planning again. The research compares algorithm variants and
    parameter settings across game environments, including work on automatic
    configuration and online adaptation.
  role: >
    I have led this line of research, including algorithm and experimental design,
    software implementation, evaluation and analysis. I have communicated the research
    through publications, conference presentations and workshops, ultimately
    leading to my PhD thesis. I have collaborated with many researchers and students, 
    including supervising MSc and PhD projects that have contributed to the RHEA research.
  outcomes:
    - Published work studies population seeding, algorithm enhancements, self-adaptation, hybrid methods and parameter optimization.
    - The 2017 seeding study reports improvements over baseline RHEA and results comparable to MCTS in its tested settings.
    - The 2020 parameter-optimization paper reports configurations that outperform prior results on several tested games; results vary by game and settings.
  technologies:
    - Java
    - Python
    - Benchmarking
    - Evolutionary algorithms
    - Planning and search
    - Game AI
    - Experimental evaluation
    - Gameplay analytics
    - Statistical analysis
    - Algorithm design and implementation
    - General Game Playing
  publications:
    - label: Rolling Horizon Evolutionary Algorithms for General Video Game Playing
      url: https://arxiv.org/abs/2003.12331
    - label: Publications on RHEA and general game playing
      url: /publications/
